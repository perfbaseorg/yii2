name: PHP CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  php-tests:
    name: PHPStan and PHPUnit on PHP ${{ matrix.php-version }} / Yii ${{ matrix.yii-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Yii 2 release (it has known security advisories,
          # so Composer's advisory blocking is disabled for resolution).
          - php-version: '7.4'
            yii-version: '2.0.45'
          - php-version: '7.4'
            yii-version: '~2.0.55'
          - php-version: '8.0'
            yii-version: '~2.0.55'
          - php-version: '8.1'
            yii-version: '~2.0.55'
          - php-version: '8.2'
            yii-version: '~2.0.55'
          - php-version: '8.3'
            yii-version: '~2.0.55'
          - php-version: '8.4'
            yii-version: '~2.0.55'
          - php-version: '8.5'
            yii-version: '~2.0.55'
          # ezyang/htmlpurifier (required by yii2) only declares PHP up to 8.5,
          # so the 8.6 lane ignores the PHP platform constraint.
          - php-version: '8.6'
            yii-version: '~2.0.55'
            ignore-php-platform: true

    steps:
      - name: Checkout yii2
        uses: actions/checkout@v4
        with:
          path: yii2

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Install Perfbase extension
        run: bash -c "$(curl -fsSL https://cdn.perfbase.com/install.sh)"

      # Yii 2.0.x depends on bower-asset/* packages, which are only published on
      # asset-packagist. Without it Composer silently falls back to the
      # unreleased 2.2.x-dev branch.
      - name: Add asset-packagist repository
        working-directory: yii2
        run: composer config repositories.asset-packagist composer https://asset-packagist.org

      - name: Resolve Yii ${{ matrix.yii-version }}
        working-directory: yii2
        run: composer update --with "yiisoft/yii2:${{ matrix.yii-version }}" --no-security-blocking --prefer-dist --no-progress ${{ matrix.ignore-php-platform && '--ignore-platform-req=php' || '' }}

      - name: Run PHPStan
        working-directory: yii2
        run: composer run phpstan

      - name: Run PHPUnit
        working-directory: yii2
        run: composer run test
